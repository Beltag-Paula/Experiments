<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGCHONGUS | MASTERMIND_OVERRIDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="scanlines"></div>

    <div class="theme-switcher">
        <button id="logoutBtn" type="button" onclick="logout()">TERMINATE_SESSION</button>
    </div>

    <div class="form-container" style="width: 85%; max-width: 800px; margin: 10vh auto; background: rgba(0, 0, 0, 0.85); border: 2px solid var(--primary-color);">
        <h2 id="admin-header"></h2> 
        
        <div id="admin-content" style="border-top: 1px solid var(--primary-color); padding-top: 20px; margin-top: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <p style="color: var(--primary-color); font-weight: bold; margin: 0;">> USER_IDENT: <span id="display-user">DARWIN</span></p>
                    <p style="margin: 5px 0;">> STATUS: [ROOT_ACTIVE]</p>
                    <p style="margin: 5px 0;">> CLEARANCE: LEVEL_10</p>
                </div>
                <div style="text-align: right; font-size: 0.8rem; color: #888;">
                    <p id="system-time">SYNCING_TIME...</p>
                    <p>> IP_TRACKING: ENABLED</p>
                </div>
            </div>
            
            <div id="data-log" style="height: 200px; background: rgba(0, 255, 65, 0.05); border: 1px dashed var(--primary-color); padding: 15px; font-size: 0.85rem; overflow-y: auto; font-family: 'Courier New', monospace; margin-bottom: 20px;">
                <p>> System initialized...</p>
                <p>> Loading encrypted protocols...</p>
                <p>> Awaiting Mastermind input...</p>
            </div>

            <div class="form-actions">
                <button class="primary-btn" onclick="fetchDatabase()">VIEW_USERS</button>
                <button class="cancelbtn" onclick="clearLogs()">CLEAR_LOGS</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        // --- 1. GATEKEEPER LOGIC (Runs immediately) ---
        (function verifyAccess() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");

            // CRITICAL: Check if Darwin is actually authorized
            if (!token || role !== "mastermind") {
                console.error("ACCESS_VIOLATION: RE-ROUTING TO LOGIN");
                alert("CRITICAL_ERROR: UNAUTHORIZED_ACCESS_DETECTED");
                window.location.href = "index.html"; 
            }
        })();

        // --- 2. INITIALIZATION ---
        window.onload = () => {
            // Start the typewriter effect
            if (typeof typeWriter === "function") {
                typeWriter("admin-header", "[MASTERMIND_CONSOLE_v4.2]", 80);
            }

            // Start System Clock
            setInterval(() => {
                document.getElementById('system-time').innerText = `SYS_TIME: ${new Date().toLocaleTimeString()}`;
            }, 1000);
        };

        // --- 3. FETCH DATABASE (Example for Darwin) ---
        async function fetchDatabase() {
            const log = document.getElementById("data-log");
            const token = localStorage.getItem("token");

            log.innerHTML += `<p style="color: #fff;">> QUERYING BIGCHONGUS_DB...</p>`;

            try {
                // Change this URL to whatever your route is for getting users
                const response = await fetch("/api/v1/users", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    const users = await response.json();
                    log.innerHTML += `<p style="color: var(--primary-color);">> SUCCESS: ${users.length} Identities Found.</p>`;
                    log.innerHTML += `<pre style="font-size: 0.7rem;">${JSON.stringify(users, null, 2)}</pre>`;
                } else {
                    log.innerHTML += `<p style="color: var(--cancel-color);">> ERROR: UPLINK_DENIED [Code ${response.status}]</p>`;
                }
            } catch (err) {
                log.innerHTML += `<p style="color: var(--cancel-color);">> CRITICAL: CONNECTION_LOST</p>`;
            }
            log.scrollTop = log.scrollHeight; // Auto-scroll to bottom
        }

        function clearLogs() {
            document.getElementById("data-log").innerHTML = `<p>> Logs purged by Mastermind.</p>`;
        }

        // --- 4. SECURE LOGOUT ---
        function logout() {
            localStorage.clear(); // Wipe EVERYTHING (token and role)
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
