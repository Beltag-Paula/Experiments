<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <button id="themeButton">Change Theme</button>
    </div>

    <div class="calculator">
      <div class="calculator__output"></div>

      <div class="calculator__keys" id="calculator__keys"></div>
    </div>

    <script>
      const toggleBtn = document.getElementById("themeButton");
      toggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("light");
      });

      const ops = ["+", "-", "*", "/", "AC", "="];
      const buttons = [
        ...ops,
        "1",
        "2",
        "3",
        "4",
        "5",
        "6",
        "7",
        "8",
        "9",
        "0",
      ];

      const calculatorKeys = document.getElementById("calculator__keys");

      buttons.forEach((btnText, index) => {
        const btn = document.createElement("button");
        const classValue = ops.includes(btnText) ? "key operator" : "key";
        btn.setAttribute("class", classValue);
        btn.innerHTML = btnText;

        btn.addEventListener("click", myFunction);
        setTimeout(() => {
          calculatorKeys.append(btn);
        }, 100 * index);
      });

      const myOutput = document.querySelector(".calculator__output");

      function deleteOutput() {
        myOutput.innerText = "";
      }

      async function sendToServer() {
        try {
          const sendText = myOutput.innerText.replaceAll(" ","");


          const response = await fetch("/=", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ content: sendText }),
          });

          const data = await response.json();
          myOutput.innerText= data.solution;
          console.log(data);
        } catch (err) {
          console.error("Something went wrong " + err);
        }
      }

      function myFunction(event) {
        try {
          console.log(event.target.innerText);
          if (event.target.innerText === "AC") {
            deleteOutput();
            return;
          }
          if (event.target.innerText === "=") {
            return sendToServer();
          }
          const shouldSkip =
            ops.includes(event.target.innerText) &&
            ops.some((op) => myOutput.innerText.endsWith(op));
          if (shouldSkip) return;
          myOutput.innerText = `${myOutput.innerText} ${event.target.innerText}`;
          //console.log(myOutput);
          return;
        } catch (err) {
          console.error("Something went wrong " + err);
        }
      }
    </script>
  </body>
</html>
